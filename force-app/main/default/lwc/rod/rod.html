<template>
    <lightning-button 
      variant="base"
      label="ClickMe" 
      onclick={handleClick} 
    ></lightning-button>

    <template if:true={accounts}>
        <template for:each={accounts} for:item="acc">
            <li key={acc.Id}> {acc.Name} </li>
        </template>
    </template>
</template>
